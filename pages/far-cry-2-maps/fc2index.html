<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Far Cry 2 Multiplayer Maps — JeevesGB</title>
  <link rel="stylesheet" href="../../assets/css/jgb.css">
</head>
<body>
  <div class="parallax-bg"></div>

  <a href="../../index.html" class="back-btn" title="Back to Home">
    <img src="../../assets/image/back.png" alt="Back">
  </a>

  <div class="side-socials">
    <a href="https://discord.gg/m5fmspHa9m" target="_blank" rel="noopener noreferrer" class="side-social">
      <img src="../../assets/image/discord.png" alt="Discord">
      <span class="side-social-label">Discord</span>
    </a>
    <a href="https://soundcloud.com/jeevesbeats" target="_blank" rel="noopener noreferrer" class="side-social">
      <img src="../../assets/image/soundcloud.png" alt="SoundCloud">
      <span class="side-social-label">SoundCloud</span>
    </a>
  </div>

  <main class="page detail-page">

    <header style="text-align: center; margin-bottom: 1.5rem;">
      <img src="img/fc2log.png" alt="Far Cry 2" class="logo" style="max-width: 280px; margin-bottom: 1rem;">
      <h1 class="title">Far Cry 2 Multiplayer Maps</h1>
    </header>

    <section class="bento">
      <div class="panel" style="grid-column: span 12;">
        <p class="title title-left"><strong>Maps</strong></p>

        <div class="card-strip" style="overflow: visible; flex-wrap: wrap; justify-content: flex-start; gap: 1rem;">

          <a href="town.html" class="archive-card">
            <img src="img/town/town1.png" alt="Jungle Town" style="width: 160px;">
          </a>

          <a href="shipment.html" class="archive-card">
            <img src="img/ship/ship3.jpg" alt="Shipment" style="width: 160px;">
          </a>

          <a href="beached.html" class="archive-card">
            <img src="img/beached/bea1.png" alt="Beached" style="width: 160px;">
          </a>

          <a href="forgisle.html" class="archive-card">
            <img src="img/forgisle/isle1.png" alt="Forgotten Isle" style="width: 160px;">
          </a>

          <a href="beach-assault-1.html" class="archive-card">
            <img src="img/beach1/beach1.jpg" alt="Beach Assault 1" style="width: 160px;">
          </a>

          <a href="dcove.html" class="archive-card">
            <img src="img/cove/cove1.jpg" alt="Diamond Cove" style="width: 160px;">
          </a>

        </div>
      </div>
    </section>

  </main>

  <footer>
    © 2026 JeevesGB<br>
    All rights reserved.
  </footer>

  <script>
    const bg = document.querySelector('.parallax-bg');
    if (bg) {
      window.addEventListener('scroll', function () {
        bg.style.backgroundPosition = 'center ' + (window.pageYOffset * -0.15) + 'px';
      }, { passive: true });
    }
  </script>
</body>
</html>
